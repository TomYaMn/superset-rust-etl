# ==============================================================================
# 1. HEAVY FUNDAMENTALS SWEEP (Runs ONCE daily at 13:00 UTC / 9:00 PM MYT)
# Fetches all L1, L2, L3, L4, L5 data before the US market opens.
# ==============================================================================

[[jobs]]
name = "Daily Full Sweep - S&P 500"
cron = "0 0 13 * * MON-FRI *"
mode = "--sp500"

[[jobs]]
name = "Daily Full Sweep - Earnings Today"
cron = "0 15 13 * * MON-FRI *"
mode = "--earnings"

# ==============================================================================
# 2. LIGHTWEIGHT INTRADAY OPTIONS SWEEP (Hourly during US Market Hours)
# Fetches ONLY L3, L4, L5 (Options and Pricing). Skips L1/L2.
# Runs hourly from 14:00 UTC to 21:00 UTC (10:00 PM to 5:00 AM MYT).
# ==============================================================================

[[jobs]]
name = "Hourly Options - Earnings Today"
cron = "0 0 14-21 * * MON-FRI *"
mode = "--earnings --options-only"

[[jobs]]
name = "Hourly Options - Most Volatile"
cron = "0 5 14-21 * * MON-FRI *" 
mode = "--volatile --options-only"

[[jobs]]
name = "Hourly Options - Unusual Volume"
cron = "0 10 14-21 * * MON-FRI *" 
mode = "--unusual-volume --options-only"

[[jobs]]
name = "Hourly Options - Top Gainers"
cron = "0 15 14-21 * * MON-FRI *" 
mode = "--gainers --options-only"

# ==============================================================================
# 3. NIGHTLY ACTUALS RECONCILIATION
# Runs once a day at 02:00 UTC (10:00 AM MYT) to lock in reported earnings.
# ==============================================================================

[[jobs]]
name = "Nightly Earnings Reconciliation"
cron = "0 0 2 * * * *"
mode = "--reconcile-all"